# Production stack for a self-hosted, branded, private instance.
# Postgres + the app (built from this repo) + Caddy for automatic HTTPS.
#
# From this directory:
#   cp .env.example .env        # then fill it in
#   docker compose up -d
#   docker compose --profile seed run --rm seed   # optional: load community prompts
#
# See deploy/README.md for the full walkthrough.
name: prompts

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: prompts
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}"
      POSTGRES_DB: prompts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompts -d prompts"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    # Always built from this repo so your config, logo and code changes are included
    image: prompts-library:latest
    pull_policy: build
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://prompts:${POSTGRES_PASSWORD}@db:5432/prompts?schema=public"
      DIRECT_URL: "postgresql://prompts:${POSTGRES_PASSWORD}@db:5432/prompts?schema=public"
      AUTH_URL: "https://${DOMAIN:?Set DOMAIN in deploy/.env}"
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # One-off: imports the public prompts.chat library into your database.
  # Uses the build stage, which still has the dev tooling the seed script needs.
  seed:
    profiles: ["seed"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: builder
    environment:
      DATABASE_URL: "postgresql://prompts:${POSTGRES_PASSWORD}@db:5432/prompts?schema=public"
    command: ["npx", "tsx", "prisma/seed.ts"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
